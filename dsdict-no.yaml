  - {symbol: no/sj, type: fricative}
  - {symbol: no/t, type: stop}
  - {symbol: no/v, type: fricative}

entries:
  - {grapheme: "br", phonemes: ["AP"]}
  - {grapheme: "AP", phonemes: ["AP"]}
  - {grapheme: "sil", phonemes: ["SP"]}
  - {grapheme: "-", phonemes: ["SP"]}
  - {grapheme: "pau", phonemes: ["SP"]}
  - {grapheme: "SP", phonemes: ["SP"]}

replacements:
