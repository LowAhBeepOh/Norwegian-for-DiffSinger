  - {symbol: no/ax, type: vowel}
  - {symbol: no/ee, type: vowel}
  - {symbol: no/eh, type: vowel}
  - {symbol: no/ih, type: vowel}
  - {symbol: no/ii, type: vowel}
  - {symbol: no/oa, type: vowel}
