  - {symbol: no/oe, type: vowel}
  - {symbol: no/oeh, type: vowel}
  - {symbol: no/oej, type: vowel}
  - {symbol: no/oh, type: vowel}
  - {symbol: no/oj, type: vowel}
  - {symbol: no/oo, type: vowel}
  - {symbol: no/uh, type: vowel}
  - {symbol: no/uu, type: vowel}
  - {symbol: no/yh, type: vowel}
