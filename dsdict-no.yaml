# Voicebank dictionary for the simplified (stressless) NOFABET phone set.
# Symbols and replacements must match phonemes.txt. Keep them in sync.
%YAML 1.2
---
symbols:
  - {symbol: AP, type: vowel}
  - {symbol: SP, type: vowel}
  - {symbol: no/aa, type: vowel}
  - {symbol: no/ae, type: vowel}
  - {symbol: no/aeh, type: vowel}
  - {symbol: no/aej, type: vowel}
