  - {symbol: no/f, type: fricative}
  - {symbol: no/g, type: stop}
  - {symbol: no/h, type: aspirate}
  - {symbol: no/j, type: semivowel}
  - {symbol: no/k, type: stop}
  - {symbol: no/kj, type: stop}
  - {symbol: no/l, type: liquid}
  - {symbol: no/lx, type: liquid}
  - {symbol: no/m, type: nasal}
  - {symbol: no/n, type: nasal}
  - {symbol: no/ng, type: nasal}
  - {symbol: no/nx, type: nasal}
  - {symbol: no/p, type: stop}
  - {symbol: no/r, type: liquid}
  - {symbol: no/rd, type: stop}
  - {symbol: no/rl, type: liquid}
